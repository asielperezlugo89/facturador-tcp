name: Build APKs

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-cliente:
    name: Build ClienteTCP APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-cliente-${{ hashFiles('android/ClienteTCP/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-cliente-

      - name: Grant execute permission for gradlew
        run: chmod +x android/ClienteTCP/gradlew

      - name: Generate debug keystore
        run: keytool -genkeypair -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Build ClienteTCP Release APK
        working-directory: android/ClienteTCP
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload ClienteTCP APK
        uses: actions/upload-artifact@v4
        with:
          name: ClienteTCP-APK
          path: android/ClienteTCP/app/build/outputs/apk/release/*.apk
          retention-days: 30

  build-admin:
    name: Build AdminTCP APK
    runs-on: ubuntu-latest
    steps:
