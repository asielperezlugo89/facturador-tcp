[package]
name = "mayrelsuarezgomez/factura-tcp"
version = "1.0.1"
description = "Sistema de facturación para TCP Cuba"
repository = "https://github.com/asielperezlugo89/facturador-tcp"
readme = "README.md"

[dependencies]
"python/python" = "^0.2.0"

[fs]
"/app" = "."

[[command]]
name = "factura-tcp"
module = "python/python:python"
runner = "wasi"

[command.annotations.wasi]
main-args = [
    "/app/main.py",
]
env = ["PYTHONEXECUTABLE: /bin/python", "PYTHONUNBUFFERED: 1"]
